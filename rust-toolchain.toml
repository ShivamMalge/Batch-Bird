# The default toolchain is stable, and that is a decision rather than an accident: the engine,
# its tests, and the scalar kernels must all work without nightly (techstack.md).
#
# Nightly is NOT pinned here on purpose. `std::simd` is unstable, so the SIMD feature needs
# nightly — but pinning it in this file would set the toolchain for *every* command and
# silently move the default build off stable, defeating the point. Nightly is invoked
# explicitly instead: `cargo +nightly test --features simd`.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
